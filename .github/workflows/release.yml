name: Release

# Builds the artifacts from the private source repository and publishes them:
# a standalone AppImage, the Eclipse plugin jar, and the plain fat jar.
#
# Triggered by a repository_dispatch from the source repository on every push,
# or manually (useful for a first run or a re-release).
on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/branch/tag in qmwd2006/swt-terminal
        required: false
        default: master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # This repository: provides scripts/build-appimage.sh.
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          path: release

      - name: Resolve source ref
        id: src
        run: |
          ref='${{ github.event.client_payload.ref }}'
          if [ -z "$ref" ]; then ref='${{ github.event.inputs.ref }}'; fi
          if [ -z "$ref" ]; then ref='master'; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: qmwd2006/swt-terminal
          ref: ${{ steps.src.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          path: src

      # Version data: short SHA, commit date and the CI build number, passed to
      # Maven so the jar and plugin report the same string as the release.
      - name: Resolve version
        id: ver
        working-directory: src
        run: |
          sha=$(git rev-parse --short HEAD)
          date=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
          base=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "display=v${base}-${date}-${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-${date}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Pin Maven: Tycho 4.0.12 fails to bind MavenTargetLocationFactory on some
      # of the runner's bundled Maven releases.
      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build native library
        working-directory: src
        run: ./build-native.sh

      - name: Run tests (unit + PTY integration)
        working-directory: src
        run: >-
          mvn -B verify -Pintegration
          -Dapp.commit=${{ steps.ver.outputs.sha }}
          -Dapp.commitDate=${{ steps.ver.outputs.date }}
          -Dapp.build=${{ github.run_number }}

      # install (not package): the plugin build unpacks the shaded jar from the
      # local repository, so the artifact must be installed first.
      - name: Install standalone jar
        working-directory: src
        run: >-
          mvn -B install -DskipTests
          -Dapp.commit=${{ steps.ver.outputs.sha }}
          -Dapp.commitDate=${{ steps.ver.outputs.date }}
          -Dapp.build=${{ github.run_number }}

      - name: Build Eclipse plugin
        working-directory: src/eclipse-plugin
        run: mvn -B verify
        env:
          APP_VERSION: ${{ steps.ver.outputs.display }}

      - name: Build AppImage
        env:
          APP_VERSION: ${{ steps.ver.outputs.display }}
        run: release/scripts/build-appimage.sh src

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src/target/swt-terminal-*-all.jar dist/
          cp src/eclipse-plugin/target/com.cleanssh.swtterm.eclipse-*.jar dist/
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: swt-terminal ${{ steps.ver.outputs.display }}
          body: |
            Automated build of `swt-terminal`.

            Version: `${{ steps.ver.outputs.display }}`
            Source commit: `${{ steps.src.outputs.ref }}`

            - `swt-terminal-x86_64.AppImage` — standalone terminal (needs Java 17 on PATH)
            - `com.cleanssh.swtterm.eclipse-*.jar` — Eclipse plugin (Eclipse 4.29+, i.e. 2023-09 or newer; drop into `dropins/`)
            - `swt-terminal-*-all.jar` — standalone jar (needs Java 17)
          files: |
            dist/swt-terminal-*-x86_64.AppImage
            dist/com.cleanssh.swtterm.eclipse-*.jar
            dist/swt-terminal-*-all.jar
