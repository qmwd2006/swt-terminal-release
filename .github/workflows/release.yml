name: Release

# Builds the artifacts from the private source repository and publishes them:
# a standalone AppImage, the Eclipse plugin jar, and the plain fat jar.
#
# Triggered by a repository_dispatch from the source repository on every push,
# or manually (useful for a first run or a re-release).
on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/branch/tag in qmwd2006/swt-terminal
        required: false
        default: master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # This repository: provides scripts/build-appimage.sh.
      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          path: release
          # Tags list is needed to find the previous release for the changelog.
          fetch-depth: 0

      - name: Resolve source ref
        id: src
        run: |
          ref='${{ github.event.client_payload.ref }}'
          if [ -z "$ref" ]; then ref='${{ github.event.inputs.ref }}'; fi
          if [ -z "$ref" ]; then ref='master'; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # The parent tip from the push event (empty for manual dispatches).
          echo "before=${{ github.event.client_payload.before }}" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          repository: qmwd2006/swt-terminal
          ref: ${{ steps.src.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          path: src
          # Full history, to summarise the commits since the previous release.
          fetch-depth: 0

      # Serialise releases by waiting for the release of the previous push tip.
      # Without this, two overlapping runs can publish out of order (GitHub lists
      # releases newest-created first), putting an older commit above a newer one.
      # This runs before "Find previous release" so the changelog range and the
      # published order both follow the push order.
      - name: Wait for the previous release
        run: |
          before='${{ steps.src.outputs.before }}'
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            echo "No previous commit; nothing to wait for."
            exit 0
          fi
          if ! git -C src cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Previous commit $before is not in this history (force push?); not waiting."
            exit 0
          fi
          short=$(git -C src rev-parse --short "$before")
          prev=$(git -C release tag --list 'v*' --sort=-creatordate | head -n1)
          if [ -n "$prev" ]; then
            prev_sha=${prev##*-}
            if git -C src cat-file -e "$prev_sha^{commit}" 2>/dev/null \
              && git -C src merge-base --is-ancestor "$before" "$prev_sha"; then
              echo "Previous commit is already covered by $prev."
              git -C release fetch --tags --force --quiet origin || true
              exit 0
            fi
          fi
          echo "Waiting for the release of $short ..."
          for attempt in $(seq 1 120); do
            if git -C release ls-remote --tags origin "refs/tags/v*-${short}" | grep -q .; then
              echo "Release of $short is available."
              git -C release fetch --tags --force --quiet origin || true
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the release of $short; continuing." >&2

      # Version data: short SHA, commit date, the day's release sequence and the
      # CI build number, passed to Maven so the jar and plugin report the same
      # string as the release.
      #
      # The tag is v<base>-<YYYYMMDD>-<NNN>-<sha>, where NNN is the number of
      # releases already made for that commit date (three digits). Releases are
      # serialised above, so fetching the tags here sees the previous run's tag
      # and the count is stable. A re-run of an already released commit reuses
      # its sequence instead of inventing a new version.
      - name: Resolve version
        id: ver
        working-directory: src
        run: |
          git -C ../release fetch --tags --force --quiet
          sha=$(git rev-parse --short HEAD)
          date=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
          appdate=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          base=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)
          prefix="v${base}-${date}-"
          released=$(git -C ../release tag --list "${prefix}[0-9][0-9][0-9]*-${sha}" | head -n1)
          if [ -n "$released" ]; then
            seq=${released#"${prefix}"}
            seq=${seq%%-*}
            echo "Reusing sequence $seq of $released for $sha."
          else
            count=$(git -C ../release tag --list "${prefix}*" | wc -l)
            seq=$(printf '%03d' $((count + 1)))
            echo "$count release(s) for $date; this one is $seq."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "appdate=$appdate" >> "$GITHUB_OUTPUT"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"
          echo "display=${prefix}${seq}-${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${prefix}${seq}-${sha}" >> "$GITHUB_OUTPUT"
          # OSGi qualifiers may only use [A-Za-z0-9_-]; the tag string is
          # otherwise identical, so the plugin version carries the date,
          # the day's sequence and the commit too.
          echo "qualifier=${date}-${seq}-${sha}" >> "$GITHUB_OUTPUT"

      # The previous release tag lives in this repository (the source commit is
      # in src/), so resolve it here and let the notes step use its sha.
      - name: Find previous release
        id: prev
        run: |
          prev=$(git -C release tag --list 'v*' --sort=-creatordate | head -n1)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "sha=${prev##*-}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Pin Maven: Tycho 4.0.12 fails to bind MavenTargetLocationFactory on some
      # of the runner's bundled Maven releases.
      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential xvfb \
            zsync appstream desktop-file-utils file curl libgtk-3-0 \
            || sudo apt-get install -y --no-install-recommends build-essential xvfb \
              zsync appstream desktop-file-utils file curl libgtk-3-0t64
          # Exercise the normal FUSE mount path as well as extract-and-run.
          sudo apt-get install -y --no-install-recommends fuse3 || true
          sudo apt-get install -y --no-install-recommends libfuse2 \
            || sudo apt-get install -y --no-install-recommends libfuse2t64 || true

      - name: Build native library
        working-directory: src
        run: ./build-native.sh

      - name: Run tests (unit + PTY integration)
        working-directory: src
        run: >-
          mvn -B verify -Pintegration
          -Dapp.commit=${{ steps.ver.outputs.sha }}
          -Dapp.commitDate=${{ steps.ver.outputs.date }}
          -Dapp.display=${{ steps.ver.outputs.display }}
          -Dapp.build=${{ github.run_number }}

      # install (not package): the plugin build unpacks the shaded jar from the
      # local repository, so the artifact must be installed first.
      - name: Install standalone jar
        working-directory: src
        run: >-
          mvn -B install -DskipTests
          -Dapp.commit=${{ steps.ver.outputs.sha }}
          -Dapp.commitDate=${{ steps.ver.outputs.date }}
          -Dapp.display=${{ steps.ver.outputs.display }}
          -Dapp.build=${{ github.run_number }}

      - name: Build Eclipse plugin
        working-directory: src/eclipse-plugin
        run: >-
          mvn -B verify
          -DforceContextQualifier=${{ steps.ver.outputs.qualifier }}

      - name: Build AppImages
        env:
          APP_VERSION: ${{ steps.ver.outputs.display }}
          APP_DATE: ${{ steps.ver.outputs.appdate }}
        run: |
          release/scripts/build-appimage.sh src
          APPIMAGE_VARIANT=small BUNDLE_RUNTIME=0 \
            release/scripts/build-appimage.sh src

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # All published files carry the release version. The jars are built
          # under Maven artifact versions, so rename them here rather than
          # inventing date qualifiers in the poms. The plugin name matches its
          # Bundle-Version (0.1.0.<date>-<seq>-<sha>).
          display='${{ steps.ver.outputs.display }}'
          base='${{ steps.ver.outputs.base }}'
          qualifier='${{ steps.ver.outputs.qualifier }}'
          cp src/target/swt-terminal-*-all.jar "dist/swt-terminal-${display}-all.jar"
          cp src/eclipse-plugin/target/com.cleanssh.swtterm.eclipse-*.jar \
            "dist/com.cleanssh.swtterm.eclipse-${base}.${qualifier}.jar"
          (cd dist && sha256sum swt-terminal-*-all.jar \
            swt-terminal-*-x86_64.AppImage \
            swt-terminal-*-x86_64.AppImage.zsync \
            swt-terminal-*-x86_64.tar.gz \
            swt-terminal-*-x86_64-small.AppImage \
            swt-terminal-*-x86_64-small.AppImage.zsync \
            swt-terminal-*-x86_64-small.tar.gz \
            com.cleanssh.swtterm.eclipse-*.jar > SHA256SUMS)
          ls -lh dist

      - name: Verify artifacts
        run: |
          (cd dist && sha256sum -c SHA256SUMS)

          # Every artifact reports the same version as the tag.
          display='${{ steps.ver.outputs.display }}'
          base='${{ steps.ver.outputs.base }}'
          qualifier='${{ steps.ver.outputs.qualifier }}'
          test -f "dist/swt-terminal-${display}-all.jar"
          unzip -p "dist/swt-terminal-${display}-all.jar" version.properties \
            | grep -qx "display=${display}"
          unzip -p "dist/com.cleanssh.swtterm.eclipse-${base}.${qualifier}.jar" \
              META-INF/MANIFEST.MF \
            | tr -d '\r' | grep -qx "Bundle-Version: ${base}.${qualifier}"

          full=$(echo dist/*-x86_64.AppImage)
          small=$(echo dist/*-x86_64-small.AppImage)
          test -f dist/*-x86_64.AppImage.zsync
          test -f dist/*-x86_64-small.AppImage.zsync
          test -f dist/*-x86_64.tar.gz
          test -f dist/*-x86_64-small.tar.gz
          APPIMAGE_EXTRACT_AND_RUN=1 "$full" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$small" --version

          check_update_info() {
            expected="gh-releases-zsync|qmwd2006|swt-terminal-release|latest|swt-terminal-*-$2.AppImage.zsync"
            actual=$("$1" --appimage-updateinfo)
            echo "update information ($1): $actual"
            if [ "$actual" != "$expected" ]; then
              echo "unexpected update information for $1: $actual" >&2
              exit 1
            fi
          }
          check_update_info "$full" x86_64
          check_update_info "$small" x86_64-small

          rm -rf verify-full verify-small
          mkdir verify-full verify-small
          tar -xzf dist/*-x86_64.tar.gz -C verify-full
          tar -xzf dist/*-x86_64-small.tar.gz -C verify-small
          for dir in verify-full verify-small; do
            test -x "$dir/AppRun"
            test -L "$dir/swt-terminal"
            desktop-file-validate "$dir/usr/share/applications/swt-terminal.desktop"
            appstreamcli validate --no-net "$dir/usr/share/metainfo/com.cleanssh.swtterm.appdata.xml"
            file "$dir/swt-terminal.png" | grep -q '256 x 256'
          done

          # --version does not initialise SWT/GTK; start the real window under
          # Xvfb and accept the timeout (124) as "it stayed alive". Test both
          # AppImages and both FUSE-free tarball fallbacks.
          for launcher in "$full" "$small" verify-full/AppRun verify-small/AppRun; do
            set +e
            timeout 8 xvfb-run -a -s "-screen 0 1024x768x24" \
              env SHELL=/bin/sh "$launcher"
            code=$?
            set -e
            if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
              echo "$launcher failed to start (exit $code)" >&2
              exit "$code"
            fi
          done

      # A short Chinese "Summary:" trailer in the commit message becomes the
      # release note; no raw commit list is shown.
      - name: Build release notes
        run: |
          prev_sha='${{ steps.prev.outputs.sha }}'
          prev_tag='${{ steps.prev.outputs.tag }}'
          summary=""
          if [ -n "$prev_sha" ] && git -C src cat-file -e "$prev_sha^{commit}" 2>/dev/null; then
            # Walk the commits newest-first and take the Summary of the first
            # fix/feat, so docs/chore bookkeeping does not become the note.
            summary=$(git -C src log "$prev_sha"..HEAD \
              --pretty=format:'%s%n%b%n@@END@@' \
              | awk '
                  /^@@END@@$/ { if (kind ~ /^(fix|feat)(\([^)]*\))?:/ && sum != "") print "- " sum; kind=""; sum=""; next }
                  kind == "" { kind = $0; next }
                  /^Summary:/ { sub(/^Summary:[ \t]*/, ""); sum = $0 }
                ')
            if [ -z "$summary" ]; then
              summary=$(git -C src log "$prev_sha"..HEAD --pretty=%b \
                | grep -m1 '^Summary:' | sed 's/^Summary:[[:space:]]*//')
            fi
          if [ -z "$summary" ]; then
              summary=$(git -C src log "$prev_sha"..HEAD --pretty=%b \
                | grep -m1 '^Summary:' | sed 's/^Summary:[[:space:]]*//')
            fi
          fi
          if [ -z "$summary" ]; then
            if [ -z "$prev_tag" ]; then summary="首个构建。"; else summary="例行构建。"; fi
          fi
          heading="### 变更"
          if [ -n "$prev_tag" ]; then heading="### 相对 $prev_tag 的变更"; fi
          {
            echo "Automated build of \`swt-terminal\`."
            echo
            echo "Version: \`${{ steps.ver.outputs.display }}\`"
            echo "Build: \`${{ github.run_number }}\`"
            echo "Source commit: \`${{ steps.src.outputs.ref }}\`"
            echo
            echo "$heading"
            echo
            echo "$summary"
            echo
            echo "### Artifacts"
            echo
            echo "- \`swt-terminal-*-x86_64.AppImage\` — standalone terminal (bundles a Java runtime; needs GTK 3 and FUSE)"
            echo "- \`swt-terminal-*-x86_64.tar.gz\` — extracted fallback for systems without FUSE"
            echo "- \`swt-terminal-*-x86_64.AppImage.zsync\` — update metadata for AppImageUpdate"
            echo "- \`swt-terminal-*-x86_64-small.AppImage\` — standalone terminal without a bundled runtime (needs Java 17+; GTK 3 and FUSE)"
            echo "- \`swt-terminal-*-x86_64-small.tar.gz\` — extracted fallback for the small build"
            echo "- \`swt-terminal-*-x86_64-small.AppImage.zsync\` — update metadata for the small build"
            echo "- \`com.cleanssh.swtterm.eclipse-*.jar\` — Eclipse plugin (Eclipse 4.29+; drop into \`dropins/\`)"
            echo "- \`swt-terminal-*-all.jar\` — standalone jar (needs Java 17+)"
            echo "- \`SHA256SUMS\` — checksums for the eight files above"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      # GitHub orders the Releases page by created_at, which is the committer
      # date of the commit the tag points to. Stamp an empty commit at publish
      # time and point the tag there so every release gets a unique, increasing
      # created_at instead of the release repository's HEAD date.
      - name: Stamp release commit
        id: stamp
        run: |
          stamp=$(GIT_AUTHOR_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  GIT_COMMITTER_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  git -C release -c user.name=release-bot \
                    -c user.email=release-bot@users.noreply.github.com \
                    commit-tree "$(git -C release rev-parse HEAD^{tree})" \
                    -p "$(git -C release rev-parse HEAD)" \
                    -m "release stamp ${{ steps.ver.outputs.tag }}")
          git -C release push --force origin "$stamp:refs/heads/release-stamps"
          echo "sha=$stamp" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.stamp.outputs.sha }}
          name: swt-terminal ${{ steps.ver.outputs.display }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/swt-terminal-*-x86_64.AppImage
            dist/swt-terminal-*-x86_64.AppImage.zsync
            dist/swt-terminal-*-x86_64.tar.gz
            dist/swt-terminal-*-x86_64-small.AppImage
            dist/swt-terminal-*-x86_64-small.AppImage.zsync
            dist/swt-terminal-*-x86_64-small.tar.gz
            dist/com.cleanssh.swtterm.eclipse-*.jar
            dist/swt-terminal-*-all.jar
            dist/SHA256SUMS
